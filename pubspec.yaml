name: tunebox
description: "A music app with an on-device AI that learns what you like."
publish_to: 'none'
version: 0.2.7+2008

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # state & navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1

  # playback
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1

  # sources
  youtube_explode_dart: ^3.1.0
  http: ^1.5.0
  file_picker: ^13.1.0
  audio_metadata_reader: ^1.8.0
  permission_handler: ^12.0.3
  connectivity_plus: ^7.3.1

  # storage
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.3

  # looks
  animations: ^3.0.0
  palette_generator: ^0.3.3+7
  cached_network_image: ^4.0.0
  flutter_colorpicker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.35.0
  build_runner: ^2.4.13

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/background.png"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  adaptive_icon_monochrome: "assets/icon/foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
