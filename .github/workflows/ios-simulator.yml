name: ios simulator

# Runs the real app on a simulated iPhone and takes screenshots of every tab.
# There is no way to do this off macOS, so it lives here rather than on a
# development machine.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  simulator:
    name: run on a simulated iPhone
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: build for the simulator
        run: flutter build ios --simulator --debug --dart-define=TOUR=true

      - name: boot an iPhone
        id: boot
        run: |
          xcrun simctl list devices available | head -30
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE "[0-9A-F-]{36}")
          echo "picked $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: install and launch
        id: run
        run: |
          UDID=${{ steps.boot.outputs.udid }}
          xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch --console-pty "$UDID" com.brito.tunebox \
            > app-console.log 2>&1 &
          sleep 25
          CONTAINER=$(xcrun simctl get_app_container "$UDID" com.brito.tunebox data)
          echo "box=$CONTAINER/Documents" >> "$GITHUB_OUTPUT"
          ls -la "$CONTAINER/Documents" || true

      - name: walk through the app
        run: |
          UDID=${{ steps.boot.outputs.udid }}
          BOX="${{ steps.run.outputs.box }}"
          mkdir -p shots
          shot () { sleep 3; xcrun simctl io "$UDID" screenshot "shots/$1.png"; }

          # The app splits this file on "|" and reads the first field as the
          # command id, so the id needs that separator too — with a space it
          # parses as id 0, silently skips the first command and acks the wrong
          # number.
          drive () {   # <id> <commands…>
            id="$1"; shift
            echo "$id|$*" > "$BOX/tunebox_cmd"
            for _ in $(seq 1 40); do
              [ "$(cat "$BOX/tunebox_ack" 2>/dev/null)" = "$id" ] && break
              sleep 1
            done
            [ "$(cat "$BOX/tunebox_ack" 2>/dev/null)" = "$id" ] \
              || { echo "the app never acked command $id"; exit 1; }
          }

          shot 01-home
          drive 1 "go:/explore|wait:2000"       ; shot 02-explore
          drive 2 "go:/library|wait:2000"       ; shot 03-library
          drive 3 "go:/taste|wait:3000"         ; shot 04-taste
          drive 4 "push:/settings|wait:2000"    ; shot 05-settings
          drive 5 "scroll:900|wait:1000"        ; shot 06-settings-more
          drive 6 "pop|go:/home|wait:3000|scroll:600" ; shot 07-home-scrolled
          ls -la shots

      - name: collect the simulator log
        if: always()
        run: |
          UDID=${{ steps.boot.outputs.udid }}
          xcrun simctl spawn "$UDID" log show --last 10m --style compact \
            --predicate 'processImagePath CONTAINS "Runner"' \
            > simulator.log 2>&1 || true
          cat app-console.log >> simulator.log 2>/dev/null || true
          echo "--- crashes:"
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head || echo none
          grep -ciE "fatal|exception|crash" simulator.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-simulator-screenshots
          path: |
            shots/
            simulator.log
