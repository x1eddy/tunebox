name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: android apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # A smoke test that the Android build still compiles. The APK that ships
      # is built locally, where the release signing key lives.
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: TuneBox-android-unsigned-test-build
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: ios app (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      # No Apple developer account is involved: this produces an unsigned
      # build, which is what AltStore/SideStore or Xcode sign afterwards with
      # your own Apple ID.
      - run: flutter build ios --release --no-codesign

      - name: package as an .ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qry TuneBox-unsigned.ipa Payload
          ls -lh TuneBox-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: TuneBox-ios-unsigned
          path: TuneBox-unsigned.ipa

  release:
    name: attach the iOS build to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TuneBox-ios-unsigned
          path: artifacts
      # Only the iOS build is attached here. The Android and Linux builds are
      # uploaded from the machine that holds the release signing key — an APK
      # signed by CI would carry the debug certificate, which is exactly what
      # makes Play Protect treat a sideloaded app as suspect.
      - run: |
          v="${GITHUB_REF_NAME#v}"
          mv artifacts/TuneBox-unsigned.ipa "iphone-TuneBox-$v.ipa"
          gh release upload "$GITHUB_REF_NAME" "iphone-TuneBox-$v.ipa" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
